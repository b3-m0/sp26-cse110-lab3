name: Create Form Section
description: Add a form to the meeting minutes page
title: "[HTML]: Create form section"
labels: ["html", "feature"]
assignees:
  - octocat

body:
  - type: markdown
    attributes:
      value: |
        Track implementation of the required HTML form.

  - type: checkboxes
    id: inputs
    attributes:
      label: Required Inputs
      options:
        - label: Text input
        - label: Date input
        - label: Checkbox
        - label: Radio button
        - label: Textarea
        - label: Select dropdown
        - label: Datalist
        - label: Submit button
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Any implementation details
