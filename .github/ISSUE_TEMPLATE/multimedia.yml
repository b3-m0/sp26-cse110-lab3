name: Add Multimedia Elements
description: Add images, audio, and video to meeting minutes
title: "[HTML]: Add multimedia elements"
labels: ["html", "enhancement"]
assignees:
  - octocat

body:
  - type: markdown
    attributes:
      value: |
        Track adding multimedia elements to the meeting minutes page.

  - type: checkboxes
    id: media
    attributes:
      label: Media Elements
      options:
        - label: Image added
        - label: Audio added
        - label: Video added
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe what media was added and where
    validations:
      required: true
