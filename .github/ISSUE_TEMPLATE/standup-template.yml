name: Create Standup Template
description: Create standup.md file
title: "[Docs]: Create standup.md"
labels: ["documentation"]
assignees:
  - octocat

body:
  - type: markdown
    attributes:
      value: |
        Create a reusable standup notes template.

  - type: checkboxes
    id: sections
    attributes:
      label: Required Sections
      options:
        - label: Yesterday’s work
        - label: Today’s plan
        - label: Blockers
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional Details
      placeholder: Describe formatting or structure
