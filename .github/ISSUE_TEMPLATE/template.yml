name: HTML / Structure Task
description: Tasks related to HTML structure and content
title: "[HTML]: "
labels: ["html", "feature"]
assignees:
  - octocat

body:
  - type: markdown
    attributes:
      value: |
        Use this template for HTML structure and content-related tasks.

  - type: input
    id: task
    attributes:
      label: Task Summary
      placeholder: ex. Create meeting minutes structure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe what needs to be implemented
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Requirements
      options:
        - label: Semantic HTML used
        - label: Required elements included
        - label: Valid HTML structure
        - label: Tested in browser

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
